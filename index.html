<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手書き手帳</title>
<meta name="theme-color" content="#f7f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="手書き手帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: 机（desk）の上に紙を1枚置く。上に道具帯、下は紙だけがスクロールする */
:root{
  --desk:#e3e7ed; --bar:#f7f8fa; --line:#d2d8e1; --fg:#1f2530; --muted:#646e7e;
  --accent:#2d4f86; --accent-ink:#ffffff; --chip:#eaeef4; --warn:#a4382f;
  --font-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-num:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#14171c; --bar:#1d2129; --line:#323945; --fg:#e6e9ef; --muted:#9aa4b4;
  --accent:#93b3e8; --accent-ink:#0f1522; --chip:#282e39; --warn:#ef8f86; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#14171c; --bar:#1d2129; --line:#323945; --fg:#e6e9ef; --muted:#9aa4b4;
  --accent:#93b3e8; --accent-ink:#0f1522; --chip:#282e39; --warn:#ef8f86; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font-family:var(--font-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
#app{display:flex;flex-direction:column;height:100%}
.bar{background:var(--bar);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:5}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
button,.btn{font:inherit;color:var(--fg);background:transparent;border:0;border-radius:8px;min-height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:14px}
button:hover,.btn:hover{background:var(--chip)}
button:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.35;cursor:default;background:transparent}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{min-height:30px;border-radius:7px;font-weight:500;padding:0 12px}
.seg button[aria-pressed="true"]{background:var(--bar);box-shadow:0 1px 2px rgba(0,0,0,.12);color:var(--accent)}
.nav{display:flex;align-items:center;gap:2px;min-width:0}
.title{position:relative;font-family:var(--font-num);font-weight:700;font-size:17px;padding:0 8px;min-height:36px;display:flex;align-items:center;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.title:hover{background:var(--chip)}
.title input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
select{font:inherit;font-size:14px;color:var(--fg);background:var(--chip);border:0;border-radius:8px;min-height:36px;padding:0 10px;max-width:190px}
.today{border:1px solid var(--line);font-size:13px}
.tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.sw{width:28px;height:28px;min-width:28px;min-height:28px;padding:0;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.sz{min-width:32px;padding:0}
.sz i{display:block;border-radius:50%;background:currentColor}
.sz[aria-pressed="true"]{background:var(--chip);color:var(--accent)}
.zoom{font-size:13px;font-variant-numeric:tabular-nums;min-width:52px}
#stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px max(24px,env(safe-area-inset-bottom,0px))}
#sheet{position:relative;margin:0 auto;box-shadow:0 1px 2px rgba(20,30,50,.12),0 8px 28px rgba(20,30,50,.14);border-radius:2px;background:#fcfcfa}
#sheet canvas{position:absolute;left:0;top:0;display:block}
#ov{touch-action:pan-x pan-y}
body.finger #ov{touch-action:none}
.hint{max-width:640px;margin:0 auto 12px;background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:10px 8px 10px 14px;display:flex;gap:8px;align-items:center;font-size:13.5px;line-height:1.6}
.hint p{margin:0;flex:1;min-width:0}
.empty{max-width:420px;margin:12vh auto 0;text-align:center;line-height:1.8;color:var(--muted)}
.empty h2{font-family:var(--font-num);color:var(--fg);font-size:22px;margin:0 0 6px;text-wrap:balance}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:500;padding:0 16px;margin-top:12px}
.primary:hover{background:var(--accent);filter:brightness(1.08)}
#menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 6px);width:min(320px,calc(100vw - 32px));background:var(--bar);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:2px}
#menu button,#menu label.btn{justify-content:flex-start;width:100%;text-align:left;padding:8px 10px;min-height:40px}
#menu .note{font-size:12px;color:var(--muted);padding:4px 10px 8px;line-height:1.6}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.switch{margin-left:auto;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
[aria-checked="true"] .switch{background:var(--accent)}
[aria-checked="true"] .switch::after{transform:translateX(16px)}
.danger{color:var(--warn)}
input,textarea,select{-webkit-user-select:text;user-select:text}
#evBg,#gBg{position:fixed;inset:0;z-index:15;background:rgba(15,20,30,.28);display:flex;align-items:center;justify-content:center;padding:16px}
#evCard,#gCard{width:min(440px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--bar);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:16px;display:flex;flex-direction:column;gap:12px}
#evCard h3,#gCard h3{margin:0;font-size:16px;font-weight:700}
#gCard h3{display:flex;align-items:center;gap:8px}
#gCard h3 i{font-style:normal;font-size:11px;font-weight:700;border:1.5px solid currentColor;border-radius:4px;padding:0 4px;line-height:16px;flex:none}
.gmeta{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6;white-space:pre-wrap}
#gMemo{margin:0;font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.ef{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.ef input,.ef select,.ef textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--chip);border:1px solid transparent;border-radius:8px;padding:8px 10px;min-height:40px;width:100%;box-sizing:border-box}
.ef textarea{min-height:64px;resize:vertical}
.ef input:focus,.ef select:focus,.ef textarea:focus{outline:none;border-color:var(--accent)}
.tsteps{display:flex;flex-direction:column;gap:8px}
.tstep{display:grid;grid-template-columns:34px 1fr 1fr 74px 1fr 1fr;align-items:center;gap:5px}
.tstep .tl{font-size:12.5px;color:var(--muted);font-weight:500}
.tstep button{min-height:44px;padding:0 2px;background:var(--chip);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.tstep output{text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--font-num)}
.erow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg)}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.ecols{display:flex;gap:8px;flex-wrap:wrap}
.ecols button{width:32px;height:32px;min-width:32px;min-height:32px;padding:0;border-radius:50%;border:2px solid transparent}
.ecols button[aria-pressed="true"]{border-color:var(--fg)}
.eacts{display:flex;gap:8px;flex-wrap:wrap}
.eacts button{flex:1;min-height:42px;background:var(--chip);font-weight:500;white-space:nowrap}
.eacts .ok{background:var(--accent);color:var(--accent-ink)}
.enote{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
#stampBg{position:fixed;inset:0;z-index:15;background:rgba(15,20,30,.18)}
#stampCard{position:fixed;width:min(280px,calc(100vw - 32px));background:var(--bar);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:12px;display:flex;flex-direction:column;gap:6px}
#stampCard h3{margin:0 0 4px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
#stampCard h3 span{font-size:12px;font-weight:500;color:var(--muted)}
.srow{display:grid;grid-template-columns:44px 44px 1fr 44px;align-items:center;gap:6px}
.srow b{font-size:15px;font-family:var(--font-num)}
.srow output{text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.srow output.zero{color:var(--muted);font-weight:500}
.srow button{min-height:40px;background:var(--chip);font-size:18px}
.sacts{display:flex;gap:6px;margin-top:6px}
.sacts button{flex:1;min-height:40px;background:var(--chip);font-weight:500}
.sacts .ok{background:var(--accent);color:var(--accent-ink)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bar);padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:calc(100vw - 32px);z-index:20;line-height:1.5}
.vis{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){.seg button{padding:0 9px}.title{font-size:15px}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="表示">
        <button id="vWeek" aria-pressed="true">週間</button>
        <button id="vDay" aria-pressed="false">デイリー</button>
        <button id="vPdf" aria-pressed="false">PDF</button>
      </div>
      <div class="nav">
        <button id="prev" aria-label="前へ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <label class="title" id="titleWrap"><span id="title">—</span><input id="datePick" type="date" aria-label="日付を選ぶ"></label>
        <select id="pdfSel" aria-label="PDFを選ぶ" hidden></select>
        <span class="title" id="pageNo" hidden></span>
        <button id="next" aria-label="次へ"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        <button id="todayBtn" class="today">今日</button>
        <label class="btn today" id="addPdf" hidden>＋PDF<input id="pdfFile" class="vis" type="file" accept="application/pdf,.pdf"></label>
      </div>
      <span class="spacer"></span>
      <button id="menuBtn" aria-label="設定" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
    </div>
    <div class="row tools">
      <button class="tool" data-tool="pen" aria-pressed="true" aria-label="ペン"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.5 4.1a2 2 0 012.8 0l.6.6a2 2 0 010 2.8L8.6 18.8z"/><path d="M14.5 6l3.5 3.5"/></svg><span class="hide-sm">ペン</span></button>
      <button class="tool" data-tool="hl" aria-pressed="false" aria-label="蛍光ペン"><svg viewBox="0 0 24 24"><path d="M9 14l-3 3v3h6l1-2"/><path d="M9 14l7.5-9.5a2 2 0 013 0l1 1a2 2 0 010 3L11 17z"/></svg><span class="hide-sm">蛍光ペン</span></button>
      <button class="tool" data-tool="eraser" aria-pressed="false" aria-label="消しゴム"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.6 14.6l9-9a2 2 0 012.8 0l3 3a2 2 0 010 2.8L11.8 19H8.2l-3.6-3.6a.6.6 0 010-.8z"/><path d="M9 10l5 5"/></svg><span class="hide-sm">消しゴム</span></button>
      <button class="tool" data-tool="stamp" aria-pressed="false" aria-label="台数"><svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="10" rx="3"/><path d="M8 10.5v3M11 12h2M16 10.5v3"/></svg><span class="hide-sm">台数</span></button>
      <button class="tool" data-tool="event" aria-pressed="false" aria-label="予定"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M12 13v5M9.5 15.5h5"/></svg><span class="hide-sm">予定</span></button>
      <span class="sep"></span>
      <span id="swatches" class="tools"></span>
      <span class="sep"></span>
      <span id="sizes" class="tools"></span>
      <span class="sep"></span>
      <button id="undo" aria-label="元に戻す"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12h-2" transform="translate(0 -6)"/></svg></button>
      <button id="redo" aria-label="やり直す"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 000 12h2" transform="translate(0 -6)"/></svg></button>
      <span class="spacer"></span>
      <button id="zOut" aria-label="縮小"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button id="zFit" class="zoom" title="幅に合わせる">100%</button>
      <button id="zIn" aria-label="拡大"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
    </div>
    <div id="menu" hidden>
      <button id="fingerBtn" role="switch" aria-checked="false">指でも書く<span class="switch"></span></button>
      <div class="note">オフのとき、指はスクロール専用です。Apple Pencil・マウスで書けます。</div>
      <hr>
      <button id="exportBtn">バックアップを書き出す</button>
      <label class="btn" id="importLbl">バックアップから復元<input id="importFile" class="vis" type="file" accept="application/json,.json"></label>
      <div class="note" id="storeNote">この端末のブラウザ内に自動保存しています。</div>
      <hr>
      <button id="gSyncBtn">Googleカレンダーを同期</button>
      <div class="note" id="gNote">読み取りのみです。アプリから Google には書き込みません。</div>
      <hr id="pdfDelHr" hidden>
      <button id="pdfDel" class="danger" hidden>このPDFを削除</button>
    </div>
  </header>
  <main id="stage">
    <div class="hint" id="hint" hidden><p>週間ページの各日の縦列と、デイリーページ左側の列は同じ内容です。どちらに書いても両方に表示されます。</p><button id="hintX" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="empty" id="empty" hidden>
      <h2>PDFはまだありません</h2>
      <div>手持ちのPDFテンプレートを読み込むと、ページごとに書き込めます。</div>
      <label class="btn primary">PDFを読み込む<input id="pdfFile2" class="vis" type="file" accept="application/pdf,.pdf"></label>
    </div>
    <div id="sheet"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
  </main>
</div>
<div id="evBg" hidden><form id="evCard" role="dialog" aria-label="予定" novalidate>
  <h3 id="evHead">予定を追加</h3>
  <label class="ef">タイトル<input id="evTitle" type="text" placeholder="〇〇 打合せ" autocomplete="off"></label>
  <label class="chk"><input id="evAll" type="checkbox">終日</label>
  <div class="erow"><label class="ef">日付<input id="evDate" type="date"></label><label class="ef" id="evEndDateL">終了日<input id="evEndDate" type="date"></label></div>
  <div id="evTimes" class="tsteps"><input id="evStart" type="hidden"><input id="evEnd" type="hidden">
    <div class="tstep" data-k="start"><span class="tl">開始</span><button type="button" data-d="-60">−1時</button><button type="button" data-d="-15">−15分</button><output></output><button type="button" data-d="15">＋15分</button><button type="button" data-d="60">＋1時</button></div>
    <div class="tstep" data-k="end"><span class="tl">終了</span><button type="button" data-d="-60">−1時</button><button type="button" data-d="-15">−15分</button><output></output><button type="button" data-d="15">＋15分</button><button type="button" data-d="60">＋1時</button></div>
  </div>
  <div class="erow"><label class="ef">繰り返し<select id="evRep"><option value="none">なし</option><option value="daily">毎日</option><option value="weekdays">平日（月〜金）</option><option value="weekly">毎週</option><option value="monthly">毎月（同じ日）</option><option value="yearly">毎年</option></select></label><label class="ef" id="evUntilL">繰り返しの終了日<input id="evUntil" type="date"></label></div>
  <div class="ef">色<div class="ecols" id="evCols"></div></div>
  <label class="ef">メモ<textarea id="evMemo"></textarea></label>
  <p class="enote" id="evNote" hidden>繰り返し予定の変更は、すべての回に反映されます。</p>
  <div class="eacts" id="evActs"></div>
</form></div>
<div id="gBg" hidden><div id="gCard" role="dialog" aria-label="Googleカレンダーの予定">
  <h3><i id="gMark">G</i><span id="gTitle"></span></h3>
  <p class="gmeta" id="gWhen"></p><p class="gmeta" id="gCal"></p><p class="gmeta" id="gLoc" hidden></p>
  <p id="gMemo" hidden></p>
  <p class="enote">Googleカレンダーから取り込んだ予定です。この画面では編集・削除できません。</p>
  <div class="eacts"><button id="gClose" type="button" class="ok">閉じる</button></div>
</div></div>
<div id="stampBg" hidden><div id="stampCard" role="dialog" aria-label="台数"><h3>台数<span id="stampDay"></span></h3><div id="stampRows"></div>
<div class="sacts"><button id="stampDel" class="danger">削除</button><button id="stampCancel">閉じる</button><button id="stampOk" class="ok">置く</button></div></div></div>
<div id="toast" hidden></div>

<script>
(()=>{
'use strict';
/* ---------- 定数 ---------- */
const PAPER='#fcfcfa', RULE='#d5dae2', DOT='#bcc3ce', INK='#2b313d', MUTED='#7b8494', ACCENT='#2d4f86', SAT='#2f5fb0', SUN='#c2413b';
const FD='"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif';
const FS='"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif';
const COLORS={pen:['#1d2433','#2d4f86','#c2413b','#2f7d55'],hl:['#f5d33f','#f29bb8','#8cc8f0','#a8e08c']};
const SIZES={pen:[1.4,2.4,4],hl:[10,16,24],eraser:[8,16,30]};
const UNITS=['L','M','S','C','SP','SS'];                 // 台数のサイズ区分
const WD='日月火水木金土';

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;

/* ---------- 日本の祝日（2020年以降の規則で計算） ---------- */
const holCache={};
function holidays(y){
  if(holCache[y])return holCache[y];
  const h={},key=(m,d)=>`${y}-${pad(m)}-${pad(d)}`,set=(m,d,n)=>{h[key(m,d)]=n};

function drawEvents(c,r,zw,ds){const sc=r.w/zw,boxes=[];c.save();c.translate(r.x,r.y);c.scale(sc,sc);c.textBaseline='alphabetic';
  const list=occOn(ds).concat(gOn(ds)).sort((a,b)=>(b.e.allDay-a.e.allDay)||((a.e.start||'')<(b.e.start||'')?-1:(a.e.start||'')>(b.e.start||'')?1:0));
  const over=list.length>EVMAX,shown=over?list.slice(0,EVMAX-1):list,n=shown.length+(over?1:0),top=TOT0-2-n*(EVH+1);
  shown.forEach((o,i)=>{const y=top+i*(EVH+1),col=o.e.color||EVCOL[0],x=2,w=zw-4,title=o.e.title||'（無題）';
    if(o.g){c.fillStyle='#fff';c.fillRect(x,y,w,EVH);c.strokeStyle=col;c.lineWidth=1.2;c.strokeRect(x+.6,y+.6,w-1.2,EVH-1.2);
      c.fillStyle=col;c.font=`700 7.5px ${FS}`;c.fillText('G',x+3.5,y+9.5);let tx=x+11;c.fillStyle=INK;
      if(!o.e.allDay){c.font=`700 8px ${FS}`;const tt=`${o.e.start}–${o.e.end}`;c.fillText(tt,tx,y+9.5);tx+=c.measureText(tt).width+4}
      c.font=`700 9px ${FS}`;clipText(c,title,tx,y+9.5,x+w-4-tx)}
    else if(o.e.allDay){c.fillStyle=col;c.beginPath();c.roundRect?c.roundRect(x,y,w,EVH,3):c.rect(x,y,w,EVH);c.fill();c.fillStyle='#fff';c.font=`700 9px ${FS}`;clipText(c,title,x+4,y+9.5,w-7)}
    else{c.fillStyle=PAPER;c.fillRect(x,y,w,EVH);c.fillStyle=hexA(col,.18);c.fillRect(x,y,w,EVH);c.fillStyle=col;c.fillRect(x,y,2.5,EVH);
      c.font=`700 8px ${FS}`;const tt=`${o.e.start}–${o.e.end}`;c.fillText(tt,x+5,y+9.5);const tw=c.measureText(tt).width+4;c.font=`700 9px ${FS}`;clipText(c,title,x+5+tw,y+9.5,w-tw-8)}
    boxes.push({x,y,w,h:EVH,o})});
  if(over){const y=top+(EVMAX-1)*(EVH+1);c.fillStyle=PAPER;c.fillRect(2,y,zw-4,EVH);c.fillStyle=MUTED;c.font=`700 9px ${FS}`;c.fillText(`他${list.length-EVMAX+1}件`,5,y+9.5);boxes.push({x:2,y,w:zw-4,h:EVH,more:list.slice(EVMAX-1)})}
  evBoxes.set(ds,boxes);c.restore()}
function clipText(c,s,x,y,w){if(c.measureText(s).width<=w){c.fillText(s,x,y);return}let t=s;while(t.length&&c.measureText(t+'…').width>w)t=t.slice(0,-1);c.fillText(t+'…',x,y)}

/* ---------- Googleカレンダー（読み取りのみ。Google → アプリの一方通行） ----------
   認証はリダイレクト方式（response_type=token）。同じ画面で Google に移り、戻ってきたら #access_token を読む。サーバーは使わない */
const GCAL_CLIENT_ID='517054507490-gjkh2ljmle8qm2rqv8563onts3rt319o.apps.googleusercontent.com';  // 公開されても問題のない値。クライアントシークレットは使わない
const GCAL_SCOPE='https://www.googleapis.com/auth/calendar.readonly';
const GCAL_FRESH=15*60e3, GCAL_WEEKS=4;  // 15分以内に取得済みなら省略。表示中の週の前後4週ぶんを取る
let gcal={from:null,to:null,at:0,items:[]},gBusy=false,gWhy='open';
const gAuth=(()=>{try{return JSON.parse(localStorage.getItem('tegaki-gcal'))||{}}catch(e){return{}}})();
function saveGAuth(){try{localStorage.setItem('tegaki-gcal',JSON.stringify(gAuth))}catch(e){}}
async function loadGcal(){const v=await DB.get('zones','__gcal');if(v&&Array.isArray(v.items))gcal=v}
function gOn(ds){return gcal.items.filter(g=>g.allDay?g.date<=ds&&ds<=(g.endDate||g.date):g.date===ds).map(e=>({e,g:true}))}
function gLogin(silent){if(!GCAL_CLIENT_ID){toast('GoogleカレンダーのクライアントIDが未設定です');return}
  const st=Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{localStorage.setItem('tegaki-gcal-ret',JSON.stringify({st,silent,view:state.view==='pdf'?'week':state.view,date:state.date}))}catch(e){}
  if(silent){gAuth.silentAt=Date.now();saveGAuth()}
  const q=new URLSearchParams({client_id:GCAL_CLIENT_ID,redirect_uri:location.origin+location.pathname,response_type:'token',scope:GCAL_SCOPE,state:st,include_granted_scopes:'true'});
  if(silent)q.set('prompt','none');if(gAuth.hint)q.set('login_hint',gAuth.hint);
  flush().finally(()=>{location.href='https://accounts.google.com/o/oauth2/v2/auth?'+q})}
/* Google から戻ってきたとき：URL の # を読んで消し、移動前の表示に戻す */
function gReturn(){const h=location.hash;if(!/access_token=|error=/.test(h))return;
  history.replaceState(null,'',location.pathname+location.search);
  const p=new URLSearchParams(h.slice(1));let ret={};try{ret=JSON.parse(localStorage.getItem('tegaki-gcal-ret'))||{};localStorage.removeItem('tegaki-gcal-ret')}catch(e){}
  if(!ret.st||p.get('state')!==ret.st)return;
  if(ret.date){state.date=ret.date;state.view=ret.view}
  if(p.get('access_token')){Object.assign(gAuth,{on:true,need:false,token:p.get('access_token'),exp:Date.now()+((+p.get('expires_in')||3600)-60)*1000});saveGAuth();gcal.at=0}
  else if(ret.silent){Object.assign(gAuth,{token:null,need:true});saveGAuth();toast('Googleカレンダー：再ログインが必要です（⋯メニュー →「Googleカレンダーを同期」）',6000)}
  else toast('Googleカレンダーに接続しませんでした')}
/* 許可が切れたとき：起動時とボタンでは prompt=none で取り直しを試みる（週・日の切り替えでは画面を移らない） */
function gReauth(why){gAuth.token=null;saveGAuth();
  if(why==='button')gLogin(!gAuth.need);
  else if(why==='open'&&!gAuth.need&&Date.now()-(gAuth.silentAt||0)>10*60e3)gLogin(true)}
function gText(html){const t=String(html||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|li)>/gi,'\n');return(new DOMParser().parseFromString(t,'text/html').body.textContent||'').trim()}
function gItem(ev,cal){const s=ev.start||{},e=ev.end||{},hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const o={id:ev.id,title:ev.summary||'（無題）',color:cal.backgroundColor||'#4285f4',cal:cal.summaryOverride||cal.summary||'',memo:gText(ev.description),loc:ev.location||''};
  if(s.date){o.allDay=true;o.date=s.date;const last=ymd(addDays(parse(e.date||s.date),-1));o.endDate=last<s.date?s.date:last}
  else{const a=new Date(s.dateTime),b=new Date(e.dateTime||s.dateTime);o.allDay=false;o.date=ymd(a);o.start=hm(a);o.end=hm(b);if(ymd(b)!==o.date)o.endDay=ymd(b)}
  return o}
async function gSync(why){
  if(!GCAL_CLIENT_ID||!gAuth.on||gBusy)return;if(!navigator.onLine){if(why==='button')toast('オフラインのため同期できません');return}
  const mon=monday(parse(state.date)),m=ymd(mon),me=ymd(addDays(mon,6));
  if(why!=='button'&&gcal.from&&gcal.from<=m&&me<gcal.to&&Date.now()-gcal.at<GCAL_FRESH)return;
  if(!gAuth.token||Date.now()>gAuth.exp){gReauth(why);return}
  gBusy=true;const from=ymd(addDays(mon,-7*GCAL_WEEKS)),to=ymd(addDays(mon,7*(GCAL_WEEKS+1)));
  const api=async(path,q)=>{const r=await fetch('https://www.googleapis.com/calendar/v3/'+path+'?'+new URLSearchParams(q),{headers:{Authorization:'Bearer '+gAuth.token}});
    if(r.status===401)throw{auth:true};if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
  try{const cals=((await api('users/me/calendarList',{minAccessRole:'reader'})).items||[]).filter(c=>c.selected||c.primary);
    const pri=cals.find(c=>c.primary);if(pri&&gAuth.hint!==pri.id){gAuth.hint=pri.id;saveGAuth()}
    const items=[],q={timeMin:parse(from).toISOString(),timeMax:parse(to).toISOString(),singleEvents:'true',maxResults:'2500'};
    for(const c of cals){let pt=null;do{const r=await api(`calendars/${encodeURIComponent(c.id)}/events`,pt?{...q,pageToken:pt}:q);
      for(const ev of r.items||[])if(ev.status!=='cancelled'&&!(ev.attendees||[]).some(a=>a.self&&a.responseStatus==='declined'))items.push(gItem(ev,c));
      pt=r.nextPageToken}while(pt)}
    gcal={from,to,at:Date.now(),items};await DB.put('zones','__gcal',gcal);
    if(cur&&state.view!=='pdf')drawMain();if(why==='button')toast(`Googleカレンダーを同期しました（${items.length}件）`)}
  catch(e){if(e&&e.auth){gBusy=false;gReauth(why);return}if(why==='button')toast('Googleカレンダーを同期できませんでした')}
  finally{gBusy=false;updGNote()}}
function updGNote(){const n=$('#gNote'),d=gcal.at?new Date(gcal.at):null;
  n.textContent=!GCAL_CLIENT_ID?'まだ設定されていません。':gAuth.need?'再ログインが必要です。上のボタンを押してください。':
    d?`最終同期：${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}（読み取りのみ）`:'読み取りのみです。アプリから Google には書き込みません。'}
$('#gSyncBtn').addEventListener('click',()=>{closeMenu();if(!GCAL_CLIENT_ID){toast('GoogleカレンダーのクライアントIDが未設定です');return}
  if(!gAuth.on||gAuth.need)gLogin(false);else gSync('button')});

let ed=null;
function eventTap(z,q){const s=z.r.w/z.zw,x=(q.x-z.r.x)/s,y=(q.y-z.r.y)/s;
  if(!z.id.startsWith('vday:')){toast('予定は日付の列に登録できます');return}
  const ds=z.id.slice(5),b=[...(evBoxes.get(ds)||[])].reverse().find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);

/* 時刻はボタンで15分・1時間ずつ調整する。開始を動かすと長さを保ったまま終了も動く */
function showTimes(){for(const k of['start','end'])$(`.tstep[data-k="${k}"] output`).textContent=$(k==='start'?'#evStart':'#evEnd').value}
function stepTime(k,d){let s=tmin($('#evStart').value||'09:00'),e=tmin($('#evEnd').value||'10:00');const len=e-s;
  if(k==='start'){s=Math.max(0,Math.min(24*60-15,s+d));e=Math.min(24*60-1,s+len)}else e=Math.max(s+15,Math.min(24*60-1,e+d));

/* ---------- 台数スタンプ ---------- */
let sp=null;
function stampTap(z,q,cx,cy,long){
  const s=z.r.w/z.zw,x=(q.x-z.r.x)/s,y=(q.y-z.r.y)/s;
  if(!z.id.startsWith('vday:')){toast('台数の札は日付の列に置けます');return}
  const ex=[...strokes(z.id)].reverse().find(o=>o.t==='stamp'&&hit(o,x,y,3/s));
  if(ex&&!long){const o={...ex,sel:!ex.sel},arr=strokes(z.id),i=arr.indexOf(ex);if(!o.sel)delete o.sel;
    if(i>=0){arr[i]=o;markDirty(z.id);pushUndo({op:'swap',id:z.id,a:ex,b:o});drawMain()}return}
  if(!ex&&y>=TOT0&&y<=TD0){toast('台数計の欄は自動で集計されます');return}
  sp={z,x:Math.max(1,Math.min(x,z.zw-30)),y:Math.max(STH/2+1,y),ex,v:ex?{...ex.v}:{}};
  const d=parse(z.id.slice(5));$('#stampDay').textContent=`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
  $('#stampOk').textContent=ex?'更新':'置く';$('#stampDel').hidden=!ex;renderRows();
  const bg=$('#stampBg'),card=$('#stampCard');bg.hidden=false;
  const W=card.offsetWidth,H=card.offsetHeight,vw=innerWidth,vh=innerHeight;
  card.style.left=Math.max(16,Math.min(cx+16,vw-W-16))+'px';card.style.top=Math.max(16,Math.min(cy-H/2,vh-H-16))+'px';
}
function renderRows(){const box=$('#stampRows');box.innerHTML='';
  for(const u of UNITS){const n=sp.v[u]||0,row=document.createElement('div');row.className='srow';
    row.innerHTML=`<b>${u}</b><button aria-label="${u}を1減らす">−</button><output class="${n?'':'zero'}">${n}</output><button aria-label="${u}を1増やす">＋</button>`;
    const[minus,plus]=row.querySelectorAll('button');minus.onclick=()=>{sp.v[u]=Math.max(0,n-1);renderRows()};plus.onclick=()=>{sp.v[u]=Math.min(99,n+1);renderRows()};box.appendChild(row)}}

$('#stampDel').onclick=()=>{const{z,ex}=sp,arr=strokes(z.id),i=arr.indexOf(ex);if(i>=0){arr.splice(i,1);markDirty(z.id);pushUndo({op:'del',id:z.id,st:[ex]});drawMain()}closeStamp()};

  else{const o={t:'stamp',x:ex?ex.x:sp.x,y:ex?ex.y:sp.y,v,bw:+stampWidth(v).toFixed(2)};if(ex&&ex.sel)o.sel=true;
    if(ex){const i=arr.indexOf(ex);if(i>=0){arr[i]=o;pushUndo({op:'swap',id:z.id,a:ex,b:o})}}else{arr.push(o);pushUndo({op:'add',id:z.id,st:[o]})}}

  document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===state.tool));
  const t=state.tool,sw=$('#swatches'),noCol=t==='eraser'||t==='stamp'||t==='event';sw.innerHTML='';
  if(!noCol)for(const c of COLORS[t]){const b=document.createElement('button');b.className='sw';b.style.background=c;b.setAttribute('aria-label','色 '+c);b.setAttribute('aria-pressed',state.color[t]===c);b.onclick=()=>{state.color[t]=c;savePrefs();updTools()};sw.appendChild(b)}
  sw.hidden=noCol;sw.previousElementSibling.hidden=noCol;
  const sz=$('#sizes');sz.innerHTML='';sz.hidden=sz.previousElementSibling.hidden=t==='event';if(t==='event')return;if(t==='stamp'){const b=document.createElement('button');b.textContent='選択解除';b.style.fontSize='13px';b.style.border='1px solid var(--line)';b.onclick=clearSel;sz.appendChild(b);return}['細','中','太'].forEach((lab,i)=>{const b=document.createElement('button');b.className='sz';b.setAttribute('aria-label',lab);b.setAttribute('aria-pressed',state.size[t]===i);
    const d=t==='pen'?[4,7,11][i]:[8,12,16][i];b.innerHTML=`<i style="width:${d}px;height:${d}px;${t==='eraser'?'background:transparent;border:1.5px solid currentColor':''}"></i>`;b.onclick=()=>{state.size[t]=i;savePrefs();updTools()};sz.appendChild(b)});
}
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{state.tool=b.dataset.tool;updTools();if(state.tool==='event')toast('列をタップ：予定を追加（台数計の上にまとめて表示）／予定をタップ：編集',5000);if(state.tool==='stamp')toast('列をタップ：札を置く／札をタップ：選択（台数計に別集計）／札を長押し：修正',5000)}));
$('#vWeek').onclick=()=>go('week');$('#vDay').onclick=()=>go('day');
$('#vPdf').onclick=()=>{state.view='pdf';if(!state.pdfId)state.pdfId=pdfList[0]?.id||null;state.fit=true;render(true)};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#todayBtn').onclick=()=>{state.date=ymd(new Date());render(true)};
$('#datePick').addEventListener('change',e=>{if(e.target.value){state.date=e.target.value;render(true)}});
$('#pdfSel').addEventListener('change',e=>{state.pdfId=e.target.value;state.pdfPage=0;render(true)});
$('#undo').onclick=undo;$('#redo').onclick=redo;
function zoomBy(f){if(!cur)return;const cx=(stage.scrollLeft+stage.clientWidth/2)/state.zoom,cy=(stage.scrollTop+stage.clientHeight/2)/state.zoom;
  state.fit=false;state.zoom=Math.max(.3,Math.min(4,state.zoom*f));sizeCanvases();drawMain();
  stage.scrollLeft=cx*state.zoom-stage.clientWidth/2;stage.scrollTop=cy*state.zoom-stage.clientHeight/2}
$('#zIn').onclick=()=>zoomBy(1.25);$('#zOut').onclick=()=>zoomBy(.8);
$('#zFit').onclick=()=>{if(!cur)return;state.fit=true;sizeCanvases();drawMain()};
$('#hintX').onclick=()=>{try{localStorage.setItem('tegaki-hint','1')}catch(e){}$('#hint').hidden=true;if(state.fit&&cur){sizeCanvases();drawMain()}};
function closeMenu(){$('#menu').hidden=true;$('#menuBtn').setAttribute('aria-expanded','false');delArm=false;$('#pdfDel').textContent='このPDFを削除'}
$('#menuBtn').onclick=e=>{e.stopPropagation();const m=$('#menu');if(m.hidden){m.hidden=false;$('#menuBtn').setAttribute('aria-expanded','true')}else closeMenu()};
$('#menu').addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',()=>{if(!$('#menu').hidden)closeMenu()});
function updFinger(){$('#fingerBtn').setAttribute('aria-checked',state.finger);document.body.classList.toggle('finger',state.finger)}
$('#fingerBtn').onclick=()=>{state.finger=!state.finger;savePrefs();updFinger()};
window.addEventListener('keydown',e=>{const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);if(typing||!$('#evBg').hidden||!$('#gBg').hidden)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(e.key==='ArrowLeft'&&e.target.tagName!=='INPUT')step(-1);else if(e.key==='ArrowRight'&&e.target.tagName!=='INPUT')step(1)});
let rzT=0;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(cur&&state.fit){sizeCanvases();drawMain()}},120)});
let toastT=0;function toast(msg,ms=3200){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);if(ms)toastT=setTimeout(()=>t.hidden=true,ms)}

/* ---------- 起動 ---------- */
(async()=>{
  updTools();updFinger();updUndo();
  await DB.open();
  if(!DB.ok)$('#storeNote').textContent='この環境では保存できません。ページを閉じると書いた内容は消えます。';
  else{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
    pdfList=((await DB.all('pdfmeta'))||[]).sort((a,b)=>a.added-b.added);
    /* 台数計の欄を足した・広げたので、以前ToDo欄に書いた線や札を新しいToDo欄の位置へ移す */
    const lv=(await DB.get('zones','__layout'))||1;
    if(lv<3){const steps=[[2,722,38],[3,766,24]].filter(s=>lv<s[0]);
      for(const k of(await DB.keys('zones'))||[]){if(!String(k).startsWith('vday:'))continue;
        const a=await DB.get('zones',k);if(!Array.isArray(a))continue;let ch=false;
        for(const[,lim,dy]of steps)for(const s of a){
          if(s.t==='stamp'){if(s.y>=lim){s.y+=dy;ch=true}continue}
          if(!s.p)continue;let my=1e9;for(let i=1;i<s.p.length;i+=3)my=Math.min(my,s.p[i]);if(my>=lim){for(let i=1;i<s.p.length;i+=3)s.p[i]+=dy;ch=true}}
        if(ch)await DB.put('zones',k,a)}
      await DB.put('zones','__layout',3)}}
  await loadEvents();await loadGcal();gReturn();updGNote();
  await render(true);
  if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load(`700 44px ${FD}`,'0123456789月'),document.fonts.load(`700 15px ${FS}`,'月火水木金土日メモ週間今日開く連動第')]).then(()=>{if(cur)drawMain()}).catch(()=>{})}
})();
})();
</script>

/* PWA：オフライン起動用の Service Worker（https か localhost でのみ動く） */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
